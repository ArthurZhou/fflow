[package]
name = "fflow"
version = "0.1.0"
edition = "2021"
description = "Visual, Scratch-like FFmpeg batch processor (pure Rust, egui)"

[dependencies]
eframe = "0.29"
egui = "0.29"
egui_node_graph2 = "0.7"
rfd = "0.15"
walkdir = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# `egui_node_graph2` 0.7 scales its *style* for zoom but forgets two constants
# in the node layout (`port_height` and a 5 px margin), so every inline input
# row kept ~25 px of unscaled padding and cards grew to 4x their natural height
# when zoomed out. See vendor/egui_node_graph2/src/editor_ui.rs for the patch.
[patch.crates-io]
egui_node_graph2 = { path = "vendor/egui_node_graph2" }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3          # 最高优化等级（默认就是 3，但显式声明更稳妥）
lto = "fat"            # 开启全程序链接时优化（Link-Time Optimization），大幅提升跨模块性能
codegen-units = 1      # 将并行代码生成单元设为 1，让 LLVM 有全局视野进行深度优化（会增加编译时间）
panic = "abort"        # 遇到 panic 时直接终止，省去栈展开（Unwinding）的开销，减小体积并略微提升性能
strip = true           # 自动剥离符号表和调试信息，减小二进制文件体积，加快加载启动速度