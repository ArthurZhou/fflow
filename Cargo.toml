[package]
name = "fflow"
version = "0.1.0"
edition = "2021"
description = "Visual, Scratch-like FFmpeg batch processor (pure Rust, egui)"

[dependencies]
eframe = "0.29"
egui = "0.29"
egui_node_graph2 = "0.7"
rfd = "0.15"
walkdir = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# `egui_node_graph2` 0.7 scales its *style* for zoom but forgets two constants
# in the node layout (`port_height` and a 5 px margin), so every inline input
# row kept ~25 px of unscaled padding and cards grew to 4x their natural height
# when zoomed out. See vendor/egui_node_graph2/src/editor_ui.rs for the patch.
[patch.crates-io]
egui_node_graph2 = { path = "vendor/egui_node_graph2" }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
