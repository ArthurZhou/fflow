# Compile and test the same tree on all three platforms.
#
# The release workflow proves the *binaries* build; this proves the *tests*
# pass, which is what actually catches a Windows-only assumption (a path
# separator, a font that only exists on one OS, a `cfg` block that is wrong on
# the platform nobody develops on).
name: CI

on:
  push:
    # Version tags are release.yml's business; building twice for one version
    # would be pointless.
    tags-ignore: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # 22.04 for the same reason as release.yml: the oldest glibc we claim
        # to support is the one worth testing on.
        os: [windows-latest, ubuntu-22.04, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --locked

      # The 103 tests cover the compiler, the graph and the headless UI. The
      # one thing they cannot cover is a real ffmpeg round trip, which needs
      # `--selftest` and a machine with ffmpeg installed.
